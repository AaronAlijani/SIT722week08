name: 04 - Deploy to Production

on:
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      # ---------- Blue/green deployment of the frontend ----------

      - name: Find live and idle frontend slot
        run: |
          if ! kubectl get svc frontend -n production >/dev/null 2>&1; then
            kubectl apply -f kubernetes/bluegreen/frontend-public-service.yaml
          fi
          LIVE_APP=$(kubectl get svc frontend -n production -o jsonpath='{.spec.selector.app}')
          OLD_SELECTOR=$(kubectl get svc frontend -n production -o jsonpath='{.spec.selector}')
          if [ "$LIVE_APP" = "frontend-blue" ]; then IDLE=green; else IDLE=blue; fi
          echo "LIVE_APP=$LIVE_APP" >> "$GITHUB_ENV"
          echo "OLD_SELECTOR=$OLD_SELECTOR" >> "$GITHUB_ENV"
          echo "IDLE=$IDLE" >> "$GITHUB_ENV"
          echo "Live: $LIVE_APP | deploying new version to idle slot: $IDLE"

      - name: Deploy new frontend to idle slot
        run: |
          IMAGE=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ github.event.workflow_run.head_sha }}
          sed -e "s|__SLOT__|$IDLE|g" -e "s|__IMAGE__|$IMAGE|g" \
            kubernetes/bluegreen/frontend-slot.yaml | kubectl apply -f -
          kubectl rollout status deployment/frontend-$IDLE -n production --timeout=300s

      - name: Smoke test idle slot (no live traffic yet)
        run: |
          kubectl port-forward svc/frontend-$IDLE 8081:80 -n production >/dev/null 2>&1 &
          PF=$!
          sleep 5
          python3 scripts/bluegreen_check.py \
            --url http://127.0.0.1:8081/ \
            --duration 10 --interval 1 --max-error-rate 0 || { kill $PF; exit 1; }
          kill $PF

      - name: Switch live traffic to new slot
        run: |
          kubectl patch svc frontend -n production --type=json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/selector\",\"value\":{\"app\":\"frontend-$IDLE\"}}]"
          echo "CUTOVER_DONE=true" >> "$GITHUB_ENV"
          echo "Traffic now goes to frontend-$IDLE"

      - name: Watch error rate after cut-over
        run: |
          PUBLIC_IP=$(kubectl get svc frontend -n production -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Watching http://$PUBLIC_IP/"
          python3 scripts/bluegreen_check.py \
            --url http://$PUBLIC_IP/ \
            --duration 60 --interval 1 --max-error-rate 0.05

      - name: Roll back to previous slot
        if: ${{ failure() && env.CUTOVER_DONE == 'true' }}
        run: |
          kubectl patch svc frontend -n production --type=json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/selector\",\"value\":$OLD_SELECTOR}]"
          echo "::error::Error rate too high after cut-over. Rolled back to $LIVE_APP"

      - name: Remove legacy frontend Deployment
        run: |
          kubectl delete deployment frontend -n production --ignore-not-found

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production