apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-__SLOT__
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-__SLOT__
  template:
    metadata:
      labels:
        app: frontend-__SLOT__
    spec:
      containers:
        - name: frontend
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-__SLOT__
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: frontend-__SLOT__
  ports:
    - port: 80
      targetPort: 80